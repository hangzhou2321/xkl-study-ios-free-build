name: Build 81 staged iPhone Release
on:
  push:
    branches: ['codex/compact-build81-release-safety-net']
permissions:
  contents: read
jobs:
  release:
    runs-on: macos-15-intel
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 6af0456e586c5249cdede6af45d248db47130863
          persist-credentials: false
      - name: Pin release source and reject private context
        run: |
          test "$(git rev-parse HEAD)" = 6af0456e586c5249cdede6af45d248db47130863
          echo "Release source: $(git rev-parse HEAD)"
          python3 - <<'PY'
          from pathlib import Path
          forbidden = ['Resources/deck.json', 'Resources/personal-state.bin', 'Resources/resource-manifest.json']
          assert not any(Path(p).exists() for p in forbidden), 'Private content must be imported on the phone, not uploaded'
          assert not list(Path('.').rglob('*.xklcontent')), 'Private import packages must stay local'
          assert not list(Path('.').rglob('*.xklquestions')), 'Question bank packages must stay local'
          assert not list(Path('.').rglob('*.xklconcepts')), 'Concept packages must stay local'
          assert not list(Path('.').rglob('*.xklcourse')), 'Teaching courses must stay local'
          assert not list(Path('.').rglob('*.xklmath')), 'Private math packages must stay local'
          assert not list(Path('.').rglob('*.xklmathguide')), 'Private math guide packages must stay local'
          assert not list(Path('.').rglob('*.xklguide')), 'Private guide packages must stay local'
          assert not list(Path('.').rglob('guide.json')), 'Private math guide content must stay local'
          assert not list(Path('.').rglob('*math-guide*.json')), 'Private math guide payloads must stay local'
          assert not list(Path('.').rglob('*.pdf')), 'Source PDF files must stay local'
          assert not list(Path('.').rglob('*.xklflashcards')), 'Private course files must stay local'
          assert not list(Path('.').rglob('*.xklqbank')), 'Private question banks must stay local'
          PY
      - name: Run C and compact-range tests and compile unsigned iPhone Release
        run: |
          set -euo pipefail
          mkdir -p build/checked
          git rev-parse HEAD > build/checked/release-source.txt
          python3 - <<'PY'
          from pathlib import Path
          base=Path('tools/build_unsigned_ios.sh').read_text()
          marker='  swift test --jobs 2\n'
          assert base.count(marker)==1
          patched=base.replace(marker,'  swift test --jobs 2 --filter CompactComputerRangeTests\n')
          assert patched.split('xcodebuild -project',1)[1]==base.split('xcodebuild -project',1)[1]
          Path('tools/build81_stage.tmp.sh').write_text(patched)
          PY
          unset XKL_REUSE_VERIFIED_MODEL_TESTS XKL_FOCUSED_CANDIDATE
          bash tools/build81_stage.tmp.sh 2>&1 | tee build/checked/compact-and-build.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          log=Path('build/checked/compact-and-build.log').read_text()
          for name in ('testParkRatedDuplicateThenRestoreItsMemoryWithoutNewGrade','testRemovingAnOnScreenDuplicatePreservesCheckpointWithoutGrading'):
              assert any(name in line and 'passed' in line for line in log.splitlines()),name
          assert re.search(r'Executed 2 tests?, with 0 failures', log) and '** BUILD SUCCEEDED **' in log
          PY
          shasum -a 256 build/XKLStudy-unsigned.ipa | tee build/checked/ipa.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        name: Upload tested range candidate (full suite pending)
        with:
          name: XKLStudy-build81-targeted-only-full-suite-pending
          path: |
            build/XKLStudy-unsigned.ipa
            build/checked/compact-and-build.log
            build/checked/ipa.sha256
            build/checked/release-source.txt
          if-no-files-found: error
          retention-days: 3
      - name: Run complete Swift suite against same checkout
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = 6af0456e586c5249cdede6af45d248db47130863
          shasum -a 256 -c build/checked/ipa.sha256
          swift test --jobs 2 2>&1 | tee build/checked/full-suite.log
          shasum -a 256 -c build/checked/ipa.sha256
          python3 - <<'PY'
          from pathlib import Path
          import re
          l=Path('build/checked/full-suite.log').read_text()
          assert re.search(r"Test Suite 'All tests' passed",l)
          assert any(int(m[1])>=600 and int(m[2])==0 for m in re.finditer(r'Executed (\d+) tests?, with (?:\d+ tests? skipped and )?(\d+) failures',l)), 'Incomplete regression'
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        name: Upload complete suite log and original IPA hash
        if: always()
        with:
          name: XKLStudy-build81-full-regression-evidence
          path: |
            build/checked/full-suite.log
            build/checked/ipa.sha256
            build/checked/release-source.txt
          if-no-files-found: error
          retention-days: 3
