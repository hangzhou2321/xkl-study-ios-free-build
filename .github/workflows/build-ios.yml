name: Highlight quick iOS verification
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  build:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify source-only checkout
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for name in ['Resources/deck.json','Resources/personal-state.bin','Resources/resource-manifest.json']:
              assert not Path(name).exists()
          for ext in ['*.xklcontent','*.xklquestions','*.xklflashcards','*.xklqbank','*.xklconcepts','*.xklcourse','*.xklmath','*.xklmathguide','*.xklguide','*.pdf']:
              assert not list(Path('.').rglob(ext)), ext
          PY
      - name: Test marking and build unsigned iOS
        run: |
          set -euo pipefail
          python3 tools/generate_xcode_project.py --without-personal-resources
          swift test --jobs 2 --filter HandbookHighlight
          xcodebuild -project XKLStudy.xcodeproj -scheme XKLStudy -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          python3 - <<'PY'
          from pathlib import Path
          import zipfile
          app=Path('build/DerivedData/Build/Products/Release-iphoneos/XKLStudy.app')
          assert app.is_dir()
          with zipfile.ZipFile('build/XKLStudy-unsigned.ipa','w',zipfile.ZIP_DEFLATED) as archive:
              for item in sorted(app.rglob('*')):
                  if item.is_file(): archive.write(item,str(Path('Payload/XKLStudy.app')/item.relative_to(app)))
          assert Path('build/XKLStudy-unsigned.ipa').stat().st_size<=8*1024*1024
          print('Built source-only unsigned iOS IPA')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XKLStudy-highlight-quick-iOS
          path: build/XKLStudy-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
