name: Candidate unsigned iOS compile (full validation separate)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-candidate:
    runs-on: macos-15-intel
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject private content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forbidden = {'.pdf','.xklcontent','.xklquestions','.xklflashcards','.xklqbank','.xklconcepts','.xklcourse','.xklmath','.xklmathguide','.xklguide','.p12','.pfx','.p8','.pem','.key','.mobileprovision'}
          assert not [p for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in forbidden]
          assert not any(Path(p).exists() for p in ('Resources/deck.json','Resources/personal-state.bin','Resources/resource-manifest.json'))
          PY
      - name: Build source-only unsigned candidate
        run: |
          set -euo pipefail
          python3 tools/generate_xcode_project.py --without-personal-resources
          xcodebuild -project XKLStudy.xcodeproj -scheme XKLStudy -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build
          python3 - <<'PY'
          from pathlib import Path
          import plistlib, zipfile
          app = Path('build/DerivedData/Build/Products/Release-iphoneos/XKLStudy.app')
          assert app.is_dir()
          with (app / 'Info.plist').open('rb') as f:
              info = plistlib.load(f)
          assert info.get('CFBundleShortVersionString') == '1.32.1'
          assert info.get('CFBundleVersion') == '60'
          output = Path('build/XKLStudy-1.32.1-unsigned-candidate.ipa')
          with zipfile.ZipFile(output, 'w', zipfile.ZIP_DEFLATED) as archive:
              for item in sorted(app.rglob('*')):
                  if item.is_file():
                      archive.write(item, str(Path('Payload/XKLStudy.app') / item.relative_to(app)))
          assert output.stat().st_size <= 8 * 1024 * 1024
          print('Unsigned candidate built; full validation and device acceptance are separate.')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XKLStudy-1.32.1-unsigned-candidate
          path: build/XKLStudy-1.32.1-unsigned-candidate.ipa
          if-no-files-found: error
          retention-days: 1
  synthetic-store-tests:
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject private content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forbidden = {'.pdf','.xklcontent','.xklquestions','.xklflashcards','.xklqbank','.xklconcepts','.xklcourse','.xklmath','.xklmathguide','.xklguide','.p12','.pfx','.p8','.pem','.key','.mobileprovision'}
          assert not [p for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in forbidden]
          assert not any(Path(p).exists() for p in ('Resources/deck.json','Resources/personal-state.bin','Resources/resource-manifest.json'))
          PY
      - name: Run synthetic ExamStore integration tests
        run: swift test --jobs 2 --filter 'PublicDualStoreIntegrationTests|PublicQuestionDualFloatingCompatibilityTests'
