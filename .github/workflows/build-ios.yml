name: Synthetic public self rating correctness check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  self_rating:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject private content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          bad={'.pdf','.xklcontent','.xklquestions','.xklflashcards','.xklqbank','.xklconcepts','.xklcourse','.xklmath','.xklmathguide','.xklguide','.p12','.pfx','.p8','.pem','.key','.mobileprovision'}
          assert not [p for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in bad]
          assert not any(Path(p).exists() for p in ('Resources/deck.json','Resources/personal-state.bin','Resources/resource-manifest.json'))
          PY
      - name: Check preserved objective correctness
        run: |
          set -euo pipefail
          mkdir -p build/public-self-rating
          swift test --jobs 2 --filter testHistoricalSelfAssessmentDoesNotFabricateAnObjectiveMistake 2>&1 | tee build/public-self-rating/results.log
          grep 'testHistoricalSelfAssessmentDoesNotFabricateAnObjectiveMistake.*passed' build/public-self-rating/results.log
          grep -E 'Executed 1 test, with 0 failures' build/public-self-rating/results.log
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-public-self-rating
          path: build/public-self-rating/
          if-no-files-found: warn
          retention-days: 3
