name: Synthetic outline related question UI
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  outline-question:
    runs-on: macos-15-intel
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject private content
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forbidden = {'.pdf','.xklcontent','.xklquestions','.xklflashcards','.xklqbank',
                       '.xklconcepts','.xklcourse','.xklmath','.xklmathguide','.xklguide',
                       '.p12','.pfx','.p8','.pem','.key','.mobileprovision'}
          assert not [p for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in forbidden]
          assert not any(Path(p).exists() for p in ('Resources/deck.json','Resources/personal-state.bin','Resources/resource-manifest.json'))
          PY
      - name: Exercise outline via actual simulator taps
        run: python3 tools/guide_ui_test/run_outline.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-outline-related-ui
          path: |
            build/outline-related-uitest/*.log
            build/outline-related-uitest/summary.json
            build/outline-related-uitest/view-attachments/
            build/outline-related-uitest/submit-attachments/
          if-no-files-found: warn
          retention-days: 3
