name: Synthetic computer split import verification
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic-split-import:
    runs-on: macos-15-intel
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Verify no private content is present
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forbidden={'.pdf','.xklcontent','.xklquestions','.xklflashcards','.xklqbank','.xklconcepts','.xklcourse','.xklmath','.xklmathguide','.xklguide','.p12','.pfx','.p8','.pem','.key','.mobileprovision'}
          bad=[str(p) for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in forbidden]
          assert not bad, 'Private materials cannot appear in the test checkout'
          assert not any(Path(p).exists() for p in ('Resources/deck.json','Resources/personal-state.bin','Resources/resource-manifest.json'))
          PY
      - name: Run synthetic import and related regression suites
        run: |
          set -euo pipefail
          mkdir -p build/synthetic-split-tests
          for suite in HandbookComputerSplitImportTests; do
            swift test --jobs 2 --filter "$suite/testNineRelatedQuestionsImportWithoutScoresAndSubmitOnceInSeparateStore" 2>&1 | tee "build/synthetic-split-tests/$suite.log"
            SUITE="$suite" python3 - <<'PY'
          import os,re
          from pathlib import Path
          suite=os.environ['SUITE']
          s=Path(f'build/synthetic-split-tests/{suite}.log').read_text(encoding='utf8',errors='replace')
          assert f"Test Suite '{suite}' passed" in s, f'{suite} did not run successfully'
          pattern=r"Test Suite 'Selected tests' passed[^\n]*\n[^\n]*Executed\s+(\d+)\s+tests?,\s+with\s+(?:(\d+)\s+tests?\s+skipped\s+and\s+)?(\d+)\s+failures"
          m=re.findall(pattern,s)
          assert len(m)==1, f'{suite} selected summary missing'
          total,skipped,failed=map(int,(m[0][0],m[0][1] or 0,m[0][2]))
          assert total>skipped and failed==0
          print(f'SYNTHETIC_SUITE name={suite} total={total} skipped={skipped} failures={failed}')
          PY
          done
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: synthetic-computer-split-test-logs
          path: build/synthetic-split-tests/
          if-no-files-found: warn
          retention-days: 3
