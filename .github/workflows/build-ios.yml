name: Professional paused subject physical touch diagnostics
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  professional-touch:
    runs-on: macos-15-intel
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject private resources
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forbidden = {'.pdf', '.xklcontent', '.xklquestions', '.xklflashcards', '.xklqbank',
                       '.xklconcepts', '.xklcourse', '.xklmath', '.xklmathguide', '.xklguide',
                       '.p12', '.pfx', '.p8', '.pem', '.key', '.mobileprovision'}
          assert not [p for p in Path('.').rglob('*') if p.is_file() and p.suffix.lower() in forbidden]
          assert not any(Path(p).exists() for p in ('Resources/deck.json', 'Resources/personal-state.bin', 'Resources/resource-manifest.json'))
          assert not list(Path('.').rglob('guide.json'))
          PY
      - name: Exercise production root with real coordinate gesture
        env:
          TOUCH_TEST_SOURCE: mechanics
        run: python3 tools/guide_ui_test/run.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: professional-touch-mechanics-tap-and-drag-frozen-target
          path: |
            build/professional-touch-uitest/*.log
            build/professional-touch-uitest/summary.json
            build/professional-touch-uitest/tap/
            build/professional-touch-uitest/drag/
          if-no-files-found: warn
          retention-days: 3
