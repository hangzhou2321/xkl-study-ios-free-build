name: Build unsigned iOS app
on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: Run only native synthetic previews; reuse previously verified Release IPA
        type: boolean
        required: false
        default: false
      reuse_verified_model_tests:
        description: UI-only rebuild; requires exact model/storage parity with successful run 40354862241
        type: boolean
        required: false
        default: false
permissions:
  contents: read
  actions: read
jobs:
  build:
    if: ${{ !inputs.preview_only }}
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject private content from build context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forbidden = ['Resources/deck.json', 'Resources/personal-state.bin', 'Resources/resource-manifest.json']
          assert not any(Path(p).exists() for p in forbidden), 'Private content must be imported on the phone, not uploaded'
          assert not list(Path('.').rglob('*.xklcontent')), 'Private import packages must stay local'
          assert not list(Path('.').rglob('*.xklquestions')), 'Question bank packages must stay local'
          assert not list(Path('.').rglob('*.xklflashcards')), 'Private handbook cards must stay local'
          assert not list(Path('.').rglob('*.xklqbank')), 'Professional original-question packages must stay local'
          assert not list(Path('.').rglob('*.xklconcepts')), 'Concept packages must stay local'
          assert not list(Path('.').rglob('*.xklcourse')), 'Teaching courses must stay local'
          assert not list(Path('.').rglob('*.xklmath')), 'Private math packages must stay local'
          assert not list(Path('.').rglob('*.xklmathguide')), 'Private math guide packages must stay local'
          assert not list(Path('.').rglob('*.xklguide')), 'Private guide packages must stay local'
          assert not list(Path('.').rglob('guide.json')), 'Private math guide content must stay local'
          assert not list(Path('.').rglob('*math-guide*.json')), 'Private math guide payloads must stay local'
          assert not list(Path('.').rglob('*.pdf')), 'Source PDF files must stay local'
          PY
      - name: Test and compile
        env:
          XKL_REUSE_VERIFIED_MODEL_TESTS: ${{ inputs.reuse_verified_model_tests }}
          GH_TOKEN: ${{ github.token }}
        run: bash tools/build_unsigned_ios.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XKLStudy-unsigned-iOS
          path: |
            build/XKLStudy-unsigned.ipa
            build/reused-model-tests.json
          if-no-files-found: error
          retention-days: 1
  preview:
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject private content from build context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forbidden = ['Resources/deck.json', 'Resources/personal-state.bin', 'Resources/resource-manifest.json']
          assert not any(Path(p).exists() for p in forbidden), 'Private content must be imported on the phone, not uploaded'
          assert not list(Path('.').rglob('*.xklcontent')), 'Private import packages must stay local'
          assert not list(Path('.').rglob('*.xklquestions')), 'Question bank packages must stay local'
          assert not list(Path('.').rglob('*.xklflashcards')), 'Private handbook cards must stay local'
          assert not list(Path('.').rglob('*.xklqbank')), 'Professional original-question packages must stay local'
          assert not list(Path('.').rglob('*.xklconcepts')), 'Concept packages must stay local'
          assert not list(Path('.').rglob('*.xklcourse')), 'Teaching courses must stay local'
          assert not list(Path('.').rglob('*.xklmath')), 'Private math packages must stay local'
          assert not list(Path('.').rglob('*.xklmathguide')), 'Private math guide packages must stay local'
          assert not list(Path('.').rglob('*.xklguide')), 'Private guide packages must stay local'
          assert not list(Path('.').rglob('guide.json')), 'Private math guide content must stay local'
          assert not list(Path('.').rglob('*math-guide*.json')), 'Private math guide payloads must stay local'
          assert not list(Path('.').rglob('*.pdf')), 'Source PDF files must stay local'
          PY
      - name: Capture native synthetic handbook-card previews
        run: python3 tools/capture_handbook_card_previews.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: handbook-card-native-simulator-previews
          path: build/handbook-card-previews/
          if-no-files-found: error
          retention-days: 3
