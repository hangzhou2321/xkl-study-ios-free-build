name: Validate professional candidate
on:
  workflow_dispatch:
    inputs:
      preview_only:
        description: Run only native synthetic previews; reuse previously verified Release IPA
        type: boolean
        required: false
        default: false
      build_only:
        description: Run only tests and Release build; reuse matching-source native previews
        type: boolean
        required: false
        default: false
permissions:
  contents: read
jobs:
  build:
    if: ${{ !inputs.preview_only }}
    runs-on: macos-15-intel
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject private content from build context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forbidden = ['Resources/deck.json', 'Resources/personal-state.bin', 'Resources/resource-manifest.json']
          assert not any(Path(p).exists() for p in forbidden), 'Private content must be imported on the phone, not uploaded'
          assert not list(Path('.').rglob('*.xklcontent')), 'Private import packages must stay local'
          assert not list(Path('.').rglob('*.xklquestions')), 'Question bank packages must stay local'
          assert not list(Path('.').rglob('*.xklconcepts')), 'Concept packages must stay local'
          assert not list(Path('.').rglob('*.xklcourse')), 'Teaching courses must stay local'
          assert not list(Path('.').rglob('*.xklmath')), 'Private math packages must stay local'
          assert not list(Path('.').rglob('*.xklmathguide')), 'Private math guide packages must stay local'
          assert not list(Path('.').rglob('*.xklguide')), 'Private guide packages must stay local'
          assert not list(Path('.').rglob('guide.json')), 'Private math guide content must stay local'
          assert not list(Path('.').rglob('*math-guide*.json')), 'Private math guide payloads must stay local'
          assert not list(Path('.').rglob('*.pdf')), 'Source PDF files must stay local'
          PY
      - name: Test and compile
        run: bash tools/build_unsigned_ios.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: XKLStudy-professional-unsigned-iOS
          path: build/XKLStudy-unsigned.ipa
          if-no-files-found: error
          retention-days: 1
  preview:
    if: ${{ !inputs.build_only }}
    runs-on: macos-15-intel
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Reject private content from build context
        run: |
          python3 - <<'PY'
          from pathlib import Path
          forbidden = ['Resources/deck.json', 'Resources/personal-state.bin', 'Resources/resource-manifest.json']
          assert not any(Path(p).exists() for p in forbidden), 'Private content must be imported on the phone, not uploaded'
          assert not list(Path('.').rglob('*.xklcontent')), 'Private import packages must stay local'
          assert not list(Path('.').rglob('*.xklquestions')), 'Question bank packages must stay local'
          assert not list(Path('.').rglob('*.xklconcepts')), 'Concept packages must stay local'
          assert not list(Path('.').rglob('*.xklcourse')), 'Teaching courses must stay local'
          assert not list(Path('.').rglob('*.xklmath')), 'Private math packages must stay local'
          assert not list(Path('.').rglob('*.xklmathguide')), 'Private math guide packages must stay local'
          assert not list(Path('.').rglob('*.xklguide')), 'Private guide packages must stay local'
          assert not list(Path('.').rglob('guide.json')), 'Private math guide content must stay local'
          assert not list(Path('.').rglob('*math-guide*.json')), 'Private math guide payloads must stay local'
          assert not list(Path('.').rglob('*.pdf')), 'Source PDF files must stay local'
          PY
      - name: Capture native synthetic professional previews
        run: python3 tools/capture_professional_previews.py
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: professional-native-simulator-previews
          path: build/professional-previews/
          if-no-files-found: error
          retention-days: 3
